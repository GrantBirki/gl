name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: test pages packaging
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: build without installing dependencies
        run: python3 -m tools.build

      - name: test generated site
        run: python3 -m unittest discover -s tests/build -p "test_*.py"

      - name: upload site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          archive: true
          name: site-preview
          path: dist
          retention-days: 3
